<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SmartFarm AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen bg-slate-900 bg-grid-pattern relative flex items-center justify-center p-4">
    <!-- Ambient Background Lighting -->
    <div class="absolute inset-0 bg-gradient-to-br from-emerald-600/20 to-transparent pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-emerald-500/20 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="glass-dark border border-white/10 rounded-[2.5rem] p-10 md:p-12 w-full max-w-md relative z-10 shadow-2xl animate-slide-up">
        <div class="flex items-center gap-3 justify-center mb-10">
            <div class="w-12 h-12 bg-emerald-600 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-600/30">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
            </div>
            <div>
                <h1 class="text-3xl font-extrabold text-white leading-none tracking-tight">SmartFarm <span class="text-emerald-400">AI</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Create Account</p>
            </div>
        </div>

        <form id="signupForm" class="space-y-6">
            <div id="errorMsg" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 px-4 py-3 rounded-xl text-xs font-bold text-center"></div>
            
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 tracking-widest">Full Name (விவசாயி பெயர்)</label>
                <input type="text" id="fullname" required class="w-full bg-white/5 border border-white/10 focus:bg-white/10 rounded-2xl px-5 py-4 text-white font-bold outline-none focus:border-emerald-500 transition-all shadow-inner" placeholder="e.g. Anbu">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 tracking-widest">Username / Email ID</label>
                <input type="text" id="username" required autocomplete="username" class="w-full bg-white/5 border border-white/10 focus:bg-white/10 rounded-2xl px-5 py-4 text-white font-bold outline-none focus:border-emerald-500 transition-all shadow-inner" placeholder="Choose a unique username or email">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 tracking-widest">Password</label>
                <input type="password" id="password" required autocomplete="new-password" class="w-full bg-white/5 border border-white/10 focus:bg-white/10 rounded-2xl px-5 py-4 text-white font-bold outline-none focus:border-emerald-500 transition-all shadow-inner" placeholder="Create a password">
            </div>

            <button type="submit" class="w-full bg-emerald-600 text-white font-black py-4 px-6 rounded-2xl hover:bg-emerald-500 transition-all flex items-center justify-center gap-3 shadow-lg shadow-emerald-500/20 active:scale-95 group">
                <span class="text-xs tracking-widest uppercase transition-transform group-hover:scale-105">Register Access</span>
                <svg class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>
        
        <div class="mt-8 pt-6 border-t border-white/10 text-center">
            <p class="text-xs font-medium text-slate-400">Already registered? <a href="/login.html" class="text-emerald-400 font-bold hover:underline">Log in setup</a></p>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
</body>
</html>
