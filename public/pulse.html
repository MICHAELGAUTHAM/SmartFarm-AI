<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFarm AI | Live Market Pulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen relative bg-slate-50">

    <!-- TOP NAVIGATION -->
    <nav class="no-print sticky top-0 z-50 glass-card border-b border-slate-200/60 px-6 py-4 bg-white/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-600/30">
                    <span class="text-white text-xl">📈</span>
                </div>
                <a href="/" class="block">
                    <h1 class="nav-brand-title text-slate-900 leading-none" data-i18n="nav_brand">SmartFarm AI</h1>
                    <p class="section-label text-slate-400 mt-0.5" data-i18n="pulse_title">Live Market Pulse</p>
                </a>
            </div>
            
            <div class="flex items-center gap-3 md:gap-4">
                <button id="langToggleBtn" onclick="window.toggleAppLang()" class="px-3 py-1.5 text-[10px] font-black uppercase tracking-widest bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl hover:bg-emerald-600 hover:text-white hover:border-emerald-600 transition-all shadow-sm">தமிழ்</button>
                <a href="/" class="px-4 py-2 text-xs font-bold bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200 transition-colors" data-i18n="sim_back">Back to Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- HEADER / TAGLINE -->
    <header class="bg-slate-900 text-white pt-16 pb-20 px-6 relative overflow-hidden bg-grid-pattern">
        <div class="absolute inset-0 bg-gradient-to-br from-indigo-600/20 to-transparent pointer-events-none"></div>
        <div class="max-w-7xl mx-auto relative z-10 text-center animate-appear">
            <h2 class="text-4xl md:text-5xl font-black mb-4 leading-tight tracking-tighter text-white" data-i18n="pulse_title">Live Market Pulse</h2>
            <p class="text-slate-400 font-medium leading-relaxed max-w-2xl mx-auto" data-i18n="pulse_subtitle">Real-time commodity pricing and 7-day market trends</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 -mt-10 mb-24 relative z-20">
        
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
            <!-- PAGE 1: INPUT FORM -->
            <div class="md:col-span-4 bg-white rounded-[2.5rem] shadow-xl border border-slate-200/60 p-8 md:p-10 animate-slide-up">
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2 tracking-widest" data-i18n="pulse_district">Select District (Mandi)</label>
                        <select id="inputDistrict" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-slate-800 text-sm outline-none transition-colors input-focus cursor-pointer">
                            <option value="all" data-i18n="dist_all">All TN Districts (Average)</option>
                            <option value="ariyalur" data-i18n="dist_ariyalur">Ariyalur (அரியலூர்)</option>
                            <option value="chengalpattu" data-i18n="dist_chengalpattu">Chengalpattu (செங்கல்பட்டு)</option>
                            <option value="chennai" data-i18n="dist_chennai">Chennai (சென்னை)</option>
                            <option value="coimbatore" data-i18n="dist_coimbatore">Coimbatore (கோயம்புத்தூர்)</option>
                            <option value="cuddalore" data-i18n="dist_cuddalore">Cuddalore (கடலூர்)</option>
                            <option value="dharmapuri" data-i18n="dist_dharmapuri">Dharmapuri (தருமபுரி)</option>
                            <option value="dindigul" data-i18n="dist_dindigul">Dindigul (திண்டுக்கல்)</option>
                            <option value="erode" data-i18n="dist_erode">Erode (ஈரோடு)</option>
                            <option value="kallakurichi" data-i18n="dist_kallakurichi">Kallakurichi (கள்ளக்குறிச்சி)</option>
                            <option value="kanchipuram" data-i18n="dist_kanchipuram">Kanchipuram (காஞ்சிபுரம்)</option>
                            <option value="kanyakumari" data-i18n="dist_kanyakumari">Kanyakumari (கன்னியாகுமரி)</option>
                            <option value="karur" data-i18n="dist_karur">Karur (கரூர்)</option>
                            <option value="krishnagiri" data-i18n="dist_krishnagiri">Krishnagiri (கிருஷ்ணகிரி)</option>
                            <option value="madurai" data-i18n="dist_madurai">Madurai (மதுரை)</option>
                            <option value="mayiladuthurai" data-i18n="dist_mayiladuthurai">Mayiladuthurai (மயிலாடுதுறை)</option>
                            <option value="nagapattinam" data-i18n="dist_nagapattinam">Nagapattinam (நாகப்பட்டினம்)</option>
                            <option value="namakkal" data-i18n="dist_namakkal">Namakkal (நாமக்கல்)</option>
                            <option value="nilgiris" data-i18n="dist_nilgiris">Nilgiris (நீலகிரி)</option>
                            <option value="perambalur" data-i18n="dist_perambalur">Perambalur (பெரம்பலூர்)</option>
                            <option value="pudukkottai" data-i18n="dist_pudukkottai">Pudukkottai (புதுக்கோட்டை)</option>
                            <option value="ramanathapuram" data-i18n="dist_ramanathapuram">Ramanathapuram (இராமநாதபுரம்)</option>
                            <option value="ranipet" data-i18n="dist_ranipet">Ranipet (இராணிப்பேட்டை)</option>
                            <option value="salem" data-i18n="dist_salem">Salem (சேலம்)</option>
                            <option value="sivaganga" data-i18n="dist_sivaganga">Sivaganga (சிவகங்கை)</option>
                            <option value="tenkasi" data-i18n="dist_tenkasi">Tenkasi (தென்காசி)</option>
                            <option value="thanjavur" data-i18n="dist_thanjavur">Thanjavur (தஞ்சாவூர்)</option>
                            <option value="theni" data-i18n="dist_theni">Theni (தேனி)</option>
                            <option value="thoothukudi" data-i18n="dist_thoothukudi">Thoothukudi (தூத்துக்குடி)</option>
                            <option value="tiruchirappalli" data-i18n="dist_tiruchirappalli">Tiruchirappalli (திருச்சிராப்பள்ளி)</option>
                            <option value="tirunelveli" data-i18n="dist_tirunelveli">Tirunelveli (திருநெல்வேலி)</option>
                            <option value="tirupathur" data-i18n="dist_tirupathur">Tirupathur (திருப்பத்தூர்)</option>
                            <option value="tiruppur" data-i18n="dist_tiruppur">Tiruppur (திருப்பூர்)</option>
                            <option value="tiruvallur" data-i18n="dist_tiruvallur">Tiruvallur (திருவள்ளூர்)</option>
                            <option value="tiruvannamalai" data-i18n="dist_tiruvannamalai">Tiruvannamalai (திருவண்ணாமலை)</option>
                            <option value="tiruvarur" data-i18n="dist_tiruvarur">Tiruvarur (திருவாரூர்)</option>
                            <option value="vellore" data-i18n="dist_vellore">Vellore (வேலூர்)</option>
                            <option value="viluppuram" data-i18n="dist_viluppuram">Viluppuram (விழுப்புரம்)</option>
                            <option value="virudhunagar" data-i18n="dist_virudhunagar">Virudhunagar (விருதுநகர்)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2 tracking-widest" data-i18n="pulse_crop">Select Commodity</label>
                        <select id="inputCrop" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-slate-800 text-sm outline-none transition-colors input-focus cursor-pointer">
                            <option value="tomato" data-i18n="crop_tomato">Tomato (தக்காளி)</option>
                            <option value="onion" data-i18n="crop_onion">Onion (வெங்காயம்)</option>
                            <option value="paddy" data-i18n="crop_paddy">Paddy(Dhan) (நெல்)</option>
                            <option value="cotton" data-i18n="crop_cotton">Cotton (பருத்தி)</option>
                            <option value="coconut" data-i18n="crop_coconut">Coconut (தேங்காய்)</option>
                            <option value="banana" data-i18n="crop_banana">Banana (வாழை)</option>
                            <option value="mango" data-i18n="crop_mango">Mango (மாம்பழம்)</option>
                            <option value="turmeric" data-i18n="crop_turmeric">Turmeric (மஞ்சள்)</option>
                            <option value="chilly Capsicum" data-i18n="crop_chilly">Chilly (மிளகாய்)</option>
                            <option value="groundnut" data-i18n="crop_groundnut">Groundnut (நிலக்கடலை)</option>
                        </select>
                    </div>
                </div>

                <button id="fetchBtn" onclick="fetchLiveRates()" class="w-full mt-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-black text-sm uppercase tracking-widest shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_30px_rgba(79,70,229,0.5)] transition-all active:scale-95 flex items-center justify-center gap-2">
                    <span id="btnIcon">📡</span> <span data-i18n="pulse_btn">Fetch Live Rates</span>
                </button>
            </div>

            <!-- PAGE 2: OUTPUT DASHBOARD -->
            <div id="outputPanel" class="md:col-span-8 hidden space-y-6 animate-slide-up">
                
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                     <!-- Min Price -->
                    <div class="bg-white rounded-[2rem] shadow-xl border border-slate-200/60 p-6 flex flex-col justify-center items-center text-center">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1" data-i18n="pulse_min">Min Price</p>
                        <h3 id="resMin" class="text-3xl font-black text-slate-800">₹0</h3>
                    </div>

                    <!-- Avg Price -->
                    <div class="bg-gradient-to-br from-slate-900 to-indigo-950 border border-slate-800 rounded-[2rem] p-6 text-white relative overflow-hidden shadow-xl flex flex-col items-center text-center">
                        <div class="absolute right-0 top-0 w-24 h-24 bg-indigo-500/20 rounded-full blur-2xl -mr-6 -mt-6"></div>
                        <p class="text-[10px] font-black text-indigo-300 uppercase tracking-widest mb-1 relative z-10" data-i18n="pulse_today">Today's Average</p>
                        <h2 id="resAvg" class="text-4xl font-black text-white relative z-10 mb-1">₹0</h2>
                        <span class="text-xs text-indigo-200 font-bold">per Kg</span>
                    </div>

                    <!-- Max Price -->
                    <div class="bg-white rounded-[2rem] shadow-xl border border-slate-200/60 p-6 flex flex-col justify-center items-center text-center">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1" data-i18n="pulse_max">Max Price</p>
                        <h3 id="resMax" class="text-3xl font-black text-slate-800">₹0</h3>
                    </div>
                </div>

                 <!-- AI Insight Box -->
                 <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-200/60 p-6 flex items-center gap-6">
                    <div id="aiIcon" class="w-14 h-14 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 text-2xl flex-shrink-0 animate-pulse">
                        🤖
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1" data-i18n="pulse_ai">AI Market Advisory</p>
                        <p id="resInsight" class="text-sm font-bold text-slate-700 mt-1">Analyzing...</p>
                    </div>
                </div>

                <!-- Trend Chart -->
                <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-200/60 p-8">
                    <h3 class="font-black text-slate-900 text-sm uppercase tracking-widest mb-6 flex items-center gap-2">
                        <div class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></div>
                        <span data-i18n="pulse_trend">7-Day Trend Analysis</span>
                    </h3>
                    <div class="relative h-[300px] w-full">
                        <canvas id="pulseChart"></canvas>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <script type="module" src="/js/pulse.js"></script>
</body>
</html>
