<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — SmartFarm AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }

    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 48px; border-bottom: 1px solid #21262d;
    }
    .logo { font-size: 22px; font-weight: 800; color: #3fb950; }
    nav a { color: #8b949e; text-decoration: none; font-size: 14px; }
    nav a:hover { color: #e6edf3; }

    .page { max-width: 900px; margin: 48px auto; padding: 0 24px; }
    h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
    .subtitle { color: #8b949e; margin-bottom: 40px; font-size: 15px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } nav { padding: 16px 20px; } }

    .card {
      background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 24px;
    }
    .card h3 { font-size: 13px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .card .value { font-size: 36px; font-weight: 800; }
    .green { color: #3fb950; }
    .red   { color: #f85149; }
    .gray  { color: #8b949e; }

    form label  { display: block; font-size: 13px; color: #8b949e; margin-bottom: 6px; margin-top: 18px; }
    form input  {
      width: 100%; padding: 12px 14px; border-radius: 8px;
      background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
      font-size: 15px; font-family: inherit;
    }
    form input:focus { outline: none; border-color: #3fb950; }

    .btn {
      margin-top: 22px; width: 100%; padding: 14px;
      background: #3fb950; color: #0d1117; font-weight: 700;
      font-size: 15px; border: none; border-radius: 8px; cursor: pointer;
      transition: background .2s;
    }
    .btn:hover { background: #56d364; }
    .btn:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }

    .result-panel {
      display: none; margin-top: 24px;
      background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px;
    }
    .result-panel h3 { font-size: 13px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .rec { font-size: 14px; color: #8b949e; line-height: 1.7; padding: 12px; background: #0d1117; border-radius: 8px; border-left: 3px solid #3fb950; margin-top: 12px; }
    .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #21262d; }
    .row:last-of-type { border: none; }
    .row span:first-child { color: #8b949e; font-size: 14px; }
    .row span:last-child  { font-weight: 700; font-size: 16px; }

    .alert { padding: 12px 16px; background: rgba(248,81,73,.12); border: 1px solid rgba(248,81,73,.3); border-radius: 8px; color: #f85149; font-size: 14px; margin-top: 16px; display: none; }
  </style>
</head>
<body>

<nav>
  <div class="logo">🌿 SmartFarm AI</div>
  <a href="/">← Home</a>
</nav>

<div class="page">
  <h1>Farm Dashboard</h1>
  <p class="subtitle">Enter your financial data to get an instant AI-powered prediction.</p>

  <div class="grid">
    <div class="card">
      <h3>Status</h3>
      <div class="value green">Active</div>
    </div>
    <div class="card">
      <h3>API</h3>
      <div class="value gray">/api/v1/predict</div>
    </div>
  </div>

  <div class="card">
    <h3>Run Prediction</h3>
    <form id="predictForm" onsubmit="runPrediction(event)">
      <label>Monthly Income (₹)</label>
      <input type="number" id="income" value="75000" min="0" required />

      <label>Monthly Expenses (₹)</label>
      <input type="number" id="expenses" value="42000" min="0" required />

      <button type="submit" class="btn" id="submitBtn">Predict Now</button>
    </form>
    <div class="alert" id="errorAlert"></div>
  </div>

  <div class="result-panel" id="resultPanel">
    <h3>Prediction Result</h3>
    <div class="row">
      <span>Profit</span>
      <span id="rProfit" class="green">—</span>
    </div>
    <div class="row">
      <span>Risk Level</span>
      <span id="rRisk">—</span>
    </div>
    <div class="rec" id="rRec"></div>
  </div>
</div>

<script>
  async function runPrediction(e) {
    e.preventDefault();
    const btn     = document.getElementById('submitBtn');
    const errBox  = document.getElementById('errorAlert');
    const panel   = document.getElementById('resultPanel');
    errBox.style.display = 'none';
    panel.style.display  = 'none';
    btn.textContent = '⏳ Running…';
    btn.disabled = true;

    try {
      const income   = parseFloat(document.getElementById('income').value);
      const expenses = parseFloat(document.getElementById('expenses').value);

      const res  = await fetch('/api/v1/predict', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ income, expenses })
      });
      const json = await res.json();

      if (json.status === 'success') {
        const p = json.prediction;
        document.getElementById('rProfit').textContent = '₹' + p.profit.toLocaleString();
        const riskEl = document.getElementById('rRisk');
        riskEl.textContent  = p.risk;
        riskEl.className    = p.risk === 'Low' ? 'green' : 'red';
        document.getElementById('rRec').textContent = p.recommendation;
        panel.style.display = 'block';
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        throw new Error(json.message || 'Prediction failed');
      }
    } catch (err) {
      errBox.textContent   = '⚠️ ' + err.message;
      errBox.style.display = 'block';
    } finally {
      btn.textContent = 'Predict Now';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
